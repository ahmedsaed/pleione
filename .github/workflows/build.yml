name: Build IPK

on:
  push:
    branches: [main, pleione]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The E2E suite is split across runners so a full run takes minutes.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/6

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: test-output/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Cache service runtimes
        uses: actions/cache@v6
        with:
          path: ~/.cache/webos-iptv-player/node-runtimes
          key: service-node-runtimes-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Type check
        run: npx tsc --noEmit && npx tsc -p bundled-service/tsconfig.json && npm run benchmark:typecheck

      - name: Lint and compatibility gate
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Bundle
        run: node esbuild.config.mjs

      # The Samsung bundles (docs/tizen.md), packaged into the .wgt files
      # below: the sideload one, and the store one without the LAN web
      # service, which Seller Office takes only from Partner sellers.
      - name: Bundle for Tizen
        run: |
          node esbuild.config.mjs --platform=tizen
          node esbuild.config.mjs --platform=tizen --store

      # Signed with the project's author certificate when the repository has
      # it (secrets TIZEN_AUTHOR_P12: base64 of author.p12, and
      # TIZEN_AUTHOR_PASSWORD), else the image's sample one; the distributor is
      # Tizen's public one either way. The author certificate is the app's
      # permanent identity with its package id. Users re-sign the .wgt for their
      # TV (docs/tizen.md); Tizen 7+ needs a Samsung distributor certificate.
      - name: Package Tizen .wgt
        env:
          TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
        run: |
          rm -rf build/tizen-certs && mkdir -p build/tizen-certs
          if [ -n "$TIZEN_AUTHOR_P12" ]; then
            echo "$TIZEN_AUTHOR_P12" | base64 -d > build/tizen-certs/author.p12
          fi
          docker run --rm -e TIZEN_AUTHOR_PASSWORD \
            -v "$PWD/dist-tizen:/app:ro" -v "$PWD/dist-tizen-store:/store:ro" \
            -v "$PWD/build/tizen-certs:/certs:ro" -v "$PWD/build:/out" \
            vitalets/tizen-webos-sdk@sha256:5107c8a83fae3128d3b9aa2b499a221f1e0188ebb0fa3ad5be01e9ba2eaf33dc \
            bash -lc 'set -e
              # The CLI cannot store a new profile'"'"'s passwords without a desktop
              # keyring, so the author certificate takes the place of the sample
              # one in the ready "dev" profile, under its password.
              if [ -f /certs/author.p12 ]; then
                openssl pkcs12 -in /certs/author.p12 -passin env:TIZEN_AUTHOR_PASSWORD -nodes -out /tmp/author.pem
                openssl pkcs12 -export -in /tmp/author.pem -out "$HOME/author.p12" -passout pass:developer
                rm /tmp/author.pem
              fi
              for kind in app store; do
                rm -rf /tmp/src /tmp/out && cp -r "/$kind" /tmp/src
                tizen package -t wgt -s dev -o /tmp/out -- /tmp/src
                cp /tmp/out/*.wgt "/out/pleione-$kind.wgt"
              done'
          version=$(node -p "require('./package.json').version")
          mv build/pleione-app.wgt "Pleione_${version}_tizen.wgt"
          mv build/pleione-store.wgt "Pleione_${version}_tizen_store.wgt"
          rm -rf build/tizen-certs

      - name: Build service
        run: |
          rm -rf build/bundled-service
          npx tsc -p bundled-service/tsconfig.json
          node scripts/service-compat-gate.mjs build/bundled-service
          node scripts/run-service-smoke.mjs --matrix
          cp bundled-service/package.json build/bundled-service/
          cp bundled-service/src/services.json build/bundled-service/
          cp bundled-service/src/setup/setup-page.html build/bundled-service/setup/

      - name: Package IPK
        run: ares-package --no-minify -e "*preview-libs.js" dist build/bundled-service -o .

      - name: Generate Homebrew Channel manifest
        run: npm run manifest

      # LG's Full HD TVs need a second file with the same id and version
      # (issue #62); the _fhd suffix tells the two apart for Seller Lounge.
      - name: Package Full HD IPK
        run: |
          node esbuild.config.mjs --resolution=720
          rm -rf build/ipk-fhd && mkdir -p build/ipk-fhd
          ares-package --no-minify -e "*preview-libs.js" dist-720 build/bundled-service -o build/ipk-fhd
          for f in build/ipk-fhd/*_all.ipk; do mv "$f" "$(basename "${f%_all.ipk}")_fhd_all.ipk"; done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webos-iptv-player
          path: |
            *.ipk
            *.wgt
            *.manifest.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: webos-iptv-player

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.ipk
            *.wgt
            *.manifest.json
